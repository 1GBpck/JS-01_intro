<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Студенты</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>🎓 Управление студентами</h1>
    
    <!-- Форма добавления -->
    <section class="card">
      <h2>➕ Добавить студента</h2>
      <form id="studentForm">
        <div class="form-row">
          <input type="text" id="surname" placeholder="Фамилия *" required>
          <input type="text" id="name" placeholder="Имя *" required>
          <input type="text" id="patronymic" placeholder="Отчество">
        </div>
        <div class="form-row">
          <input type="date" id="birthDate" required>
          <input type="number" id="startYear" placeholder="Год начала *" min="2000" required>
          <input type="text" id="faculty" placeholder="Факультет *" required>
        </div>
        <div id="formErrors" class="error hidden"></div>
        <button type="submit" class="btn primary">Добавить</button>
      </form>
    </section>
    
    <!-- Фильтры -->
    <section class="card">
      <h2>🔍 Фильтры</h2>
      <div class="filters">
        <input type="text" id="filterFullName" placeholder="Поиск по ФИО">
        <input type="text" id="filterFaculty" placeholder="Факультет">
        <input type="number" id="filterStartYear" placeholder="Год начала">
        <input type="number" id="filterEndYear" placeholder="Год окончания">
        <button id="clearFilters" class="btn small">✕ Сбросить</button>
      </div>
    </section>
    
    <!-- Таблица -->
    <section class="card">
      <h2>📋 Студенты <span id="count">0</span></h2>
      <div id="loadingMsg" class="loading">Загрузка студентов с сервера...</div>
      <table class="table" id="studentsTable" style="display: none;">
        <thead>
          <tr>
            <th data-sort="fullName">Ф.И.О. ↕</th>
            <th data-sort="faculty">Факультет ↕</th>
            <th data-sort="birthDate">Дата рождения ↕</th>
            <th data-sort="startYear">Обучение ↕</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody"></tbody>
      </table>
      <div id="noStudents" class="empty hidden">Студенты не найдены</div>
    </section>
  </div>
  
  <div id="toast" class="toast hidden">✓ Студент добавлен</div>
  <script src="script.js"></script>
</body>
</html>
